<body>
<section class="landing" id="landing" aria-label="문장 시작 화면">
  <div class="landing-shell">
    <div class="landing-heading">
      <div class="landing-wordmark"><span class="landing-mark" aria-hidden="true">文</span><span>문장</span></div>
      <p>책과 문장이 머무는, 나만의 조용한 공간</p>
    </div>
    <div class="landing-art" role="img" aria-label="따뜻한 햇살이 비치는 책과 식물이 있는 독서 공간">
      <img src="./landing-reading-room.jpg" alt="문장 독서 앱의 따뜻한 독서 공간" fetchpriority="high">
      <div class="art-caption"><span>YOUR PRIVATE READING ROOM</span><span class="art-rule"></span><span>오늘의 문장을 만나보세요</span></div>
    </div>
    <div class="landing-actions" aria-label="시작 메뉴">
      <button class="landing-action" id="landingFile" title="파일 열기" aria-label="파일 열기"><span class="landing-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span></button>
      <button class="landing-action" id="landingPaste" title="텍스트 붙여넣기" aria-label="텍스트 붙여넣기"><span class="landing-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><path d="M9 3h6a1 1 0 0 1 1 1v3H8V4a1 1 0 0 1 1-1Z"/><path d="M12 11v6M9 14h6"/></svg></span></button>
      <button class="landing-action" id="landingLibrary" title="서재" aria-label="서재"><span class="landing-icon library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 5.5c3.7-1.4 6.8-.7 9.5 1.5v13c-2.7-2.2-5.8-2.9-9.5-1.5v-13Z"/><path d="M21.5 5.5c-3.7-1.4-6.8-.7-9.5 1.5v13c2.7-2.2 5.8-2.9 9.5-1.5v-13Z"/></svg></span></button>
    </div>
    <div class="landing-footer"><span>파일 열기</span><span>붙여넣기</span><span>나의 서재</span></div>
  </div>
</section>
<div class="app hidden" id="home">
<header class="top"><div class="brand"><button class="iconbtn library-back" id="libraryBack" title="시작 화면" aria-label="시작 화면">‹</button><div class="brandmark"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path d="M8 21c9-4 17-2 24 4v27C23 45 15 44 8 48V21Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M56 21c-9-4-17-2-24 4v27c9-7 17-8 24-4V21Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M32 24c-8-5-9-13-2-17 8 4 8 11 2 17Z" fill="#dce8dc"/><path d="M31 24c-10 1-15-4-14-11 9 0 14 4 14 11Z" fill="#dce8dc"/><path d="M33 24c10 1 15-4 14-11-9 0-14 4-14 11Z" fill="#dce8dc"/></svg></div><div><div class="brandname">문장</div><div class="brandtag">YOUR PRIVATE READING ROOM</div></div></div><div class="topright"><button class="iconbtn" id="pasteOpen" title="텍스트 붙여넣기" aria-label="텍스트 붙여넣기">＋</button><button class="iconbtn" id="fileOpen" title="파일 열기" aria-label="파일 열기">↥</button></div></header>
<main class="main"><section class="welcome"><div><div class="eyebrow">A QUIETER KIND OF READING</div><h1>책장을 넘기는<br>나만의 시간.</h1><p>읽던 곳에서 다시 시작하고,<br>마음에 남는 문장에는 책갈피를 꽂아두세요.</p></div><div class="actions"><button class="btn primary" id="openFileBtn">↥ 파일 열기</button><button class="btn" id="pasteBtn">＋ 텍스트 붙여넣기</button></div></section>
<div class="sectionhead"><h2>나의 서재</h2><span class="count" id="bookCount">0권</span></div><section class="shelf" id="shelf"></section><div class="privacy">◉ &nbsp;모든 책과 읽기 기록은 이 기기에 저장됩니다.</div></main>
</div>
<input id="fileInput" type="file" accept=".txt,.md,.markdown,.html,.htm,.docx,.pdf,.epub,text/plain,text/markdown,text/html,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<div class="reader" id="reader"><header class="readerhead"><div class="readerbook"><strong id="readerTitle">제목</strong><small id="readerProgress">읽기 시작</small></div><div class="readercontrols"><button class="iconbtn" id="backHome" title="서재로" aria-label="서재로">⌂</button><button class="iconbtn" id="bookmarkBtn" title="책갈피" aria-label="책갈피">♧</button><button class="iconbtn" id="readerMenu" title="읽기 도구" aria-label="읽기 도구">☷</button></div></header><div class="readlayout"><aside class="toc"><h3>CONTENTS</h3><div id="tocList"></div><button id="makeToc">＋ 임의 목차 만들기</button></aside><article class="article" id="article"></article></div></div>
<nav class="island" id="island" aria-label="읽기 도구">
<button id="tocToggle" title="목차" aria-label="목차"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>

<div class="modalback" id="modalBack"><section class="modal" id="modal"><div class="modalhead"><h2 id="modalTitle">텍스트 붙여넣기</h2><button class="close" id="modalClose" aria-label="닫기">×</button></div><div id="modalBody"></div></section></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB='munjang-library-v1', PREF='munjang-prefs-v1';
let books=[],current=null,saveTimer=null,islandTimer=null,tts=null,tocVisible=true;
let prefs={font:'Noto Serif KR',size:18,spacing:0,night:false};
try{prefs={...prefs,...JSON.parse(localStorage.getItem(PREF)||'{}')}}catch{}
function persist(){try{localStorage.setItem(DB,JSON.stringify(books))}catch(e){toast('저장 공간이 부족합니다. 큰 파일은 서재에서 삭제해 주세요.')} }
function savePrefs(){localStorage.setItem(PREF,JSON.stringify(prefs));applyPrefs()}
let toastTimer;function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),s.includes('읽는 중')?8000:5000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function short(s,n=95){return s.length>n?s.slice(0,n)+'…':s}
function loadBooks(){try{books=JSON.parse(localStorage.getItem(DB)||'[]')}catch{books=[]}renderShelf()}
function renderShelf(){let shelf=$('#shelf');$('#bookCount').textContent=books.length+'권';if(!books.length){shelf.innerHTML='<div class="empty"><div class="symbol">文</div><strong>서재가 비어 있습니다</strong><p>좋아하는 책이나 읽고 싶은 글을 가져오세요.<br>읽던 위치와 책갈피가 이곳에 차곡차곡 저장됩니다.</p><button class="btn primary" id="emptyOpen">첫 번째 책 열기</button></div>';$('#emptyOpen').onclick=()=>$('#fileInput').click();return}
shelf.innerHTML=books.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).map(b=>{let pct=Math.round((b.pos||0)/Math.max(1,b.text.length)*100);return `<article class="book"><div class="cover"><div class="mini">MUNJANG · ${esc((b.ext||'TEXT').toUpperCase())}</div><div class="ctitle">${esc(b.title)}</div><div class="cfoot">A PERSONAL LIBRARY</div></div><div class="bookinfo"><div class="booktitle" title="${esc(b.title)}">${esc(b.title)}</div><div class="bookmeta">${b.text.length.toLocaleString()}자 · ${pct?`읽기 ${pct}%`:'읽기 전'}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="bookfoot"><button class="readbtn" data-read="${b.id}">${pct?'이어 읽기':'책 읽기'}　↗</button><button class="deletebtn" data-del="${b.id}" title="서재에서 삭제" aria-label="삭제">×</button></div></div></article>`}).join('');
$$('[data-read]').forEach(x=>x.onclick=()=>openBook(x.dataset.read));$$('[data-del]').forEach(x=>x.onclick=()=>{let b=books.find(b=>b.id===x.dataset.del);if(confirm(`「${b.title}」을(를) 서재에서 삭제할까요?`)){books=books.filter(b=>b.id!==x.dataset.del);persist();renderShelf();toast('서재에서 삭제했습니다.')}})}
function splitText(t){return t.replace(/\r\n?/g,'\n').replace(/\u0000/g,'').trim()}
function decodeTextBuffer(buf,encoding='auto'){
 const bytes=new Uint8Array(buf);
 const has=(...sig)=>sig.every((v,i)=>bytes[i]===v);
 // Honor explicit Unicode byte-order marks before trying legacy Korean encodings.
 if(encoding==='auto'){
  if(has(0xEF,0xBB,0xBF))return new TextDecoder('utf-8').decode(bytes);
  if(has(0xFF,0xFE))return new TextDecoder('utf-16le').decode(bytes);
  if(has(0xFE,0xFF))return new TextDecoder('utf-16be').decode(bytes);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{}
  // WHATWG names the Korean Windows code page "euc-kr"; it includes the CP949 extensions.
  try{return new TextDecoder('euc-kr',{fatal:true}).decode(bytes)}catch{}
  throw new Error('자동으로 인코딩을 판별하지 못했습니다. CP949 / Windows ANSI를 선택해 주세요.');
 }
 const key=String(encoding).toLowerCase().replace(/[_\s]/g,'-');
 const aliases={'utf8':'utf-8','utf-16':'utf-16le','utf16':'utf-16le','cp949':'euc-kr','ms949':'euc-kr','windows-949':'euc-kr','windows-1252':'windows-1252','ansi':'euc-kr','korean-ansi':'euc-kr','euc-kr':'euc-kr'};
 const label=aliases[key]||key;
 try{return new TextDecoder(label,{fatal:false}).decode(bytes).replace(/^\uFEFF/,'')}
 catch(e){throw new Error('이 브라우저에서 '+encoding+' 디코더를 사용할 수 없습니다. 최신 Chrome 또는 Edge에서 다시 시도해 주세요. ('+e.message+')')}
}
function detectEncoding(buf){return decodeTextBuffer(buf,'auto')}
function showEncodingDialog(file,buffer){
 const suggested=(()=>{const b=new Uint8Array(buffer);if(b.length>=3&&b[0]===239&&b[1]===187&&b[2]===191)return 'utf-8';if(b.length>=2&&b[0]===255&&b[1]===254)return 'utf-16le';if(b.length>=2&&b[0]===254&&b[1]===255)return 'utf-16be';try{new TextDecoder('utf-8',{fatal:true}).decode(b);return 'utf-8'}catch{return 'cp949'}})();
 openModal('텍스트 인코딩 확인',`<p class="hint">「${esc(file.name)}」의 한글이 깨진다면 인코딩을 바꿔 보세요. Windows 한글 ANSI는 보통 CP949와 같습니다.</p><div class="field"><label>문자 인코딩</label><select id="encodingChoice"><option value="utf-8" ${suggested==='utf-8'?'selected':''}>UTF-8</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option><option value="euc-kr">EUC-KR</option><option value="cp949" ${suggested==='cp949'?'selected':''}>CP949 / Windows 한국어 ANSI (권장)</option></select></div><div class="field"><label>본문 미리보기</label><textarea id="encodingPreview" readonly style="min-height:150px"></textarea></div><div class="modalactions"><button class="btn" id="encodingCancel">취소</button><button class="btn primary" id="encodingImport">이 인코딩으로 열기</button></div>`);
 const update=()=>{try{$('#encodingPreview').value=decodeTextBuffer(buffer,$('#encodingChoice').value).slice(0,1800)}catch(e){$('#encodingPreview').value=e.message}};
 $('#encodingChoice').onchange=update;$('#encodingCancel').onclick=closeModal;$('#encodingImport').onclick=()=>{try{const text=decodeTextBuffer(buffer,$('#encodingChoice').value);closeModal();makeBook(titleFrom(file.name,text),text,file.name.split('.').pop().toLowerCase())}catch(e){toast(e.message)}};update();
}
function titleFrom(name,text){let first=(text.split(/\n/).find(x=>x.trim())||'').trim();return (name||first||'제목 없는 글').replace(/\.(txt|md|markdown|html?|docx|pdf|epub)$/i,'').trim()||'제목 없는 글'}
function makeBook(title,text,ext='txt'){text=splitText(text);if(!text){toast('읽을 내용이 없습니다.');return}let b={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:title||'제목 없는 글',text,ext,created:Date.now(),updated:Date.now(),pos:0,marks:[],toc:[]};books.unshift(b);current=b;persist();renderShelf();openBook(b.id)}
async function readFile(file){
 const ext=file.name.split('.').pop().toLowerCase();toast('파일을 읽는 중입니다…');
 try{
  let text='';
  if(['txt','md','markdown'].includes(ext)){
   const buffer=await file.arrayBuffer();showEncodingDialog(file,buffer);return;
  } else if(['html','htm'].includes(ext)){
   text=detectEncoding(await file.arrayBuffer());let doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('script,style,nav,header,footer,svg,noscript').forEach(e=>e.remove());text=(doc.body.innerText||doc.body.textContent||'').trim();
  } else if(ext==='docx'){
   if(!window.mammoth) await loadFirstWorking(['https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js','https://unpkg.com/mammoth@1.9.0/mammoth.browser.min.js']);
   if(!window.mammoth)throw Error('DOCX 해석기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
   const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=r.value||'';
  } else if(ext==='pdf'){
   if(!window.pdfjsLib)await loadFirstWorking(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']);
   if(!window.pdfjsLib)throw Error('PDF 해석기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),useWorkerFetch:false,isEvalSupported:false}).promise;const pages=[];
   for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();pages.push(content.items.map(x=>x.str).join(' ').replace(/[ \t]+/g,' ').trim())}
   text=pages.filter(Boolean).join('\n\n');if(!text.trim())throw Error('PDF에서 텍스트를 찾지 못했습니다. 스캔 이미지 PDF는 OCR이 필요합니다.');
  } else if(ext==='epub'){
   const data=await file.arrayBuffer();
   let primaryError=null;
   try{text=await extractEpubZip(data)}catch(err){primaryError=err;console.warn('JSZip EPUB parser failed; trying EPUB.js fallback',err)}
   if(!text.trim()){
    try{text=await extractEpubJs(data)}catch(fallbackError){
     console.error('EPUB fallback failed',fallbackError);
     throw Error('아이폰에서 EPUB 구조를 해석하지 못했습니다. JSZip: '+(primaryError?.message||'실패')+' / 대체 해석기: '+(fallbackError?.message||'실패')+'. 파일 앱에 완전히 다운로드한 뒤 다시 선택해 보세요.');
    }
   }
   if(!text.trim())throw Error('EPUB 본문을 추출하지 못했습니다. DRM 적용 파일 또는 비표준 EPUB일 수 있습니다.');
  } else {throw Error('지원하지 않는 형식입니다. TXT, DOCX, PDF, EPUB, MD, HTML을 선택하세요.')}
  if(!text.trim())throw Error('파일은 열렸지만 읽을 수 있는 본문이 없습니다.');
  makeBook(titleFrom(file.name,text),text,ext);
 }catch(e){console.error(e);toast(e.message||'파일을 읽지 못했습니다.')}
}
async function extractEpubZip(data){
 if(!window.JSZip)await loadFirstWorking(['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js']);
 if(!window.JSZip)throw Error('JSZip 라이브러리가 없습니다.');
 const zip=await JSZip.loadAsync(data);
 const getText=async path=>{const z=zip.file(path);return z?await z.async('string'):''};
 const containerText=await getText('META-INF/container.xml');if(!containerText)throw Error('container.xml이 없습니다.');
 const parser=new DOMParser(),containerDoc=parser.parseFromString(containerText,'application/xml');
 if(containerDoc.querySelector('parsererror'))throw Error('container.xml 형식이 올바르지 않습니다.');
 const opfPath=containerDoc.getElementsByTagName('rootfile')[0]?.getAttribute('full-path');if(!opfPath)throw Error('OPF 경로를 찾을 수 없습니다.');
 const opfText=await getText(opfPath);if(!opfText)throw Error('OPF 파일을 읽지 못했습니다.');
 const opf=parser.parseFromString(opfText,'application/xml');if(opf.querySelector('parsererror'))throw Error('OPF XML이 올바르지 않습니다.');
 const manifest=new Map([...opf.getElementsByTagName('item')].map(el=>[el.getAttribute('id'),el.getAttribute('href')]));
 const spine=[...opf.getElementsByTagName('itemref')].map(el=>manifest.get(el.getAttribute('idref'))).filter(Boolean);
 const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
 const norm=path=>{const stack=[];for(const bit of path.replace(/\\/g,'/').split('/')){if(!bit||bit==='.')continue;if(bit==='..')stack.pop();else stack.push(bit)}return stack.join('/')};
 const paths=spine.map(h=>norm(base+decodeURIComponent(h.split('#')[0].split('?')[0])));
 const out=[];for(const path of paths){const markup=await getText(path);if(!markup)continue;const doc=parser.parseFromString(markup,'text/html');doc.querySelectorAll('script,style,svg,nav,noscript').forEach(el=>el.remove());const val=(doc.body?.innerText||doc.body?.textContent||doc.documentElement?.textContent||'').replace(/\u00a0/g,' ').trim();if(val)out.push(val)}
 const result=out.join('\n\n');if(!result.trim())throw Error('ZIP은 열렸지만 본문이 없습니다.');return result;
}
async function extractEpubJs(data){
 if(!window.ePub)await loadFirstWorking(['https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js','https://unpkg.com/epubjs@0.3.93/dist/epub.min.js']);
 if(!window.ePub)throw Error('EPUB.js 라이브러리를 불러오지 못했습니다.');
 const book=window.ePub(data);await Promise.race([book.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('EPUB.js 초기화 시간 초과')),20000))]);
 const items=book.spine?.spineItems||book.spine?.items||[];const out=[];
 for(const item of items){try{const doc=await Promise.race([item.load(book.load.bind(book)),new Promise((_,reject)=>setTimeout(()=>reject(Error('본문 항목 로딩 시간 초과')),10000))]);const val=(doc?.body?.innerText||doc?.body?.textContent||doc?.documentElement?.textContent||'').trim();if(val)out.push(val);item.unload?.()}catch(e){console.warn('EPUB spine item skipped',e)}}
 try{book.destroy()}catch{};const result=out.join('\n\n');if(!result.trim())throw Error('EPUB.js에서 본문을 추출하지 못했습니다.');return result;
}
async function loadFirstWorking(urls){let errors=[];for(const url of urls){try{await loadScript(url);return}catch(e){errors.push(e)}}throw Error('외부 라이브러리를 불러오지 못했습니다. 네트워크 연결 또는 CDN 접근을 확인하세요.')}
function loadScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';let timer=setTimeout(()=>{s.remove();reject(Error('라이브러리 로드 시간 초과'))},12000);s.onload=()=>{clearTimeout(timer);resolve()};s.onerror=()=>{clearTimeout(timer);s.remove();reject(Error('라이브러리 로드 실패: '+src))};document.head.append(s)})}
$('#fileOpen').onclick=$('#openFileBtn').onclick=$('#landingFile').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{let f=e.target.files[0];if(f)readFile(f);e.target.value=''};
function openBook(id){current=books.find(b=>b.id===id);if(!current)return;$('#readerTitle').textContent=current.title;$('#article').innerHTML=renderText(current);$('#reader').classList.add('open');$('#home').classList.add('hidden');$('#landing').classList.add('hidden');buildToc();applyPrefs();restorePos();showIsland();$('#reader').scrollTo ? $('#reader').scrollTo(0,0) : ($('#reader').scrollTop=0)}
function renderText(b){
 const lines=b.text.replace(/\r\n?/g,'\n').split('\n'), out=[];
 const heading=/^(?:제\s*[0-9０-９一二三四五六七八九十百]+\s*(?:장|화|절|부|편|막)(?:\s*[:：.．\-—]?\s*.*)?|(?:프롤로그|에필로그|서문|작가의 말|등장인물|목차|후기|머리말|맺음말|序章|終章|후일담|외전)(?:\s*[:：—\-].*)?|(?:chapter|part)\s*(?:[0-9０-９IVXLC]+)(?:\s*[:：.．—\-]?\s*.*)?|[0-9０-９]{1,3}\s*[.．、]\s*[^.!?]{1,70})$/i;
 out.push(`<h1>${esc(b.title)}</h1><div class="byline">PERSONAL READING EDITION · ${b.text.length.toLocaleString()} CHARACTERS</div>`);
 let paragraph=[];
 function flush(){if(paragraph.length){out.push(`<p>${esc(paragraph.join(' '))}</p>`);paragraph=[]}}
 for(let raw of lines){
  let line=raw.trim(); if(!line){flush();continue}
  // If chapter markers are embedded in a line, split before the marker.
  let parts=line.split(/(?=(?:제\s*[0-9０-９一二三四五六七八九十百]+\s*(?:장|화|절|부|편|막)\b|(?:프롤로그|에필로그|후일담|외전)\b|(?:CHAPTER|Chapter|PART|Part)\s+[0-9IVXLC]+))/);
  for(let part of parts){part=part.trim();if(!part)continue;
   if(heading.test(part)&&part.length<100){flush();out.push(`<h2>${esc(part)}</h2>`)}
   else paragraph.push(part);
  }
 }
 flush();return out.join('\n')
}
function buildToc(){
 let heads=[...$('#article').querySelectorAll('h2')];
 if(!heads.length){$('#tocList').innerHTML='<div class="hint">인식된 목차가 없습니다.<br>아래 버튼으로 임의 목차를 만들 수 있습니다.</div>';return}
 $('#tocList').innerHTML=heads.map((h,i)=>{h.id='ch'+i;return `<button data-ch="${h.id}">${esc(h.textContent)}</button>`}).join('');
 $$('[data-ch]').forEach(btn=>btn.onclick=()=>{let target=document.getElementById(btn.dataset.ch);target?.scrollIntoView({behavior:'smooth',block:'start'});$$('[data-ch]').forEach(x=>x.classList.toggle('active',x===btn));if(innerWidth<=700){$('.toc').classList.remove('mobile-open');tocVisible=false}hideIslandSoon()})
}
function makeArtificialToc(){if(!current)return;let old=$('#article');old.querySelectorAll('.autohead').forEach(x=>x.remove());let ps=[...old.querySelectorAll('p')];if(ps.length<2){toast('본문이 짧아 목차를 나눌 수 없습니다.');return}let count=Math.min(12,Math.max(3,Math.ceil(ps.length/18))),step=Math.ceil(ps.length/count);for(let i=0;i<count;i++){let p=ps[i*step];if(!p)continue;let h=document.createElement('h2');h.className='autohead';h.textContent=`구간 ${i+1}`;h.id='auto'+i;p.parentNode.insertBefore(h,p)}buildToc();toast('본문을 구간별로 나눴습니다.')}
$('#makeToc').onclick=makeArtificialToc;$('#backHome').onclick=()=>closeReader();function closeReader(){savePosition();stopTts();$('#reader').classList.remove('open');$('#home').classList.remove('hidden');$('#landing').classList.add('hidden');renderShelf();$('#reader').scrollTo ? $('#reader').scrollTo(0,0) : ($('#reader').scrollTop=0)}
function savePosition(){if(!current)return;let art=$('#article'),r=art.getBoundingClientRect(),pos=Math.max(0,Math.min(current.text.length,Math.round((window.scrollY+0)/Math.max(1,document.documentElement.scrollHeight)*current.text.length)));current.pos=pos;current.updated=Date.now();persist()}
function restorePos(){let p=current.pos||0;if(p>0){let ratio=p/Math.max(1,current.text.length);setTimeout(()=>{$('#reader').scrollTop=Math.max(0,ratio*($('#reader').scrollHeight-$('#reader').clientHeight));updateProgress()},80)}else $('#reader').scrollTo ? $('#reader').scrollTo(0,0) : ($('#reader').scrollTop=0);updateProgress()}
$('#reader').addEventListener('scroll',()=>{if($('#reader').classList.contains('open')){updateProgress();scheduleSave();showIsland()}},{passive:true});
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(!current)return;let max=$('#reader').scrollHeight-$('#reader').clientHeight;current.pos=Math.round(Math.max(0,$('#reader').scrollTop)/Math.max(1,max)*current.text.length);current.updated=Date.now();persist()},500)}
function updateProgress(){if(!current)return;let pct=Math.min(100,Math.round($('#reader').scrollTop/Math.max(1,$('#reader').scrollHeight-$('#reader').clientHeight)*100));$('#readerProgress').textContent=`읽기 ${pct}% · ${current.marks?.length||0}개 책갈피`}
function applyPrefs(){let a=$('#article');a.style.fontFamily=`"${prefs.font}", "AppleMyungjo", Batang, serif`;a.style.fontSize=prefs.size+'px';a.style.letterSpacing=prefs.spacing+'px';$('#reader').classList.toggle('night',!!prefs.night);}
function showIsland(){if(!$('#reader').classList.contains('open'))return;$('#island').classList.add('visible');clearTimeout(islandTimer);islandTimer=setTimeout(()=>$('#island').classList.remove('visible'),2600)}
function hideIslandSoon(){clearTimeout(islandTimer);islandTimer=setTimeout(()=>$('#island').classList.remove('visible'),900)}
document.addEventListener('mousemove',showIsland);document.addEventListener('touchstart',showIsland,{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalBack').classList.contains('open'))closeModal();else if($('#reader').classList.contains('open'))closeReader()}});
$('#readerMenu').onclick=()=>{showIsland();$('#island').classList.toggle('visible')};$('#tocToggle').onclick=()=>{let t=$('.toc');if(innerWidth<=700){tocVisible=!t.classList.contains('mobile-open');t.classList.toggle('mobile-open',tocVisible)}else{tocVisible=!tocVisible;t.style.display=tocVisible?'block':'none';$('.readlayout').style.gridTemplateColumns=tocVisible?'190px minmax(0,650px)':'minmax(0,650px)'}showIsland()};

function addBookmark(){if(!current)return;let max=$('#reader').scrollHeight-$('#reader').clientHeight;let pos=Math.round(Math.max(0,$('#reader').scrollTop)/Math.max(1,max)*current.text.length);let heads=[...$('#article').querySelectorAll('h2')],nearest=null;for(let h of heads){if(h.getBoundingClientRect().top<innerHeight*.55)nearest=h}let mark={id:Date.now(),pos,label:nearest?nearest.textContent:`읽던 곳 · ${Math.round(pos/Math.max(1,current.text.length)*100)}%`};current.marks=current.marks||[];current.marks.push(mark);persist();updateProgress();toast('책갈피를 저장했습니다.')}
$('#bookmarkBtn').onclick=addBookmark;$('#bookmarkMenu').onclick=showBookmarks;
function showBookmarks(){if(!current)return;openModal('책갈피',`<div class="bookmarklist">${(current.marks||[]).length?(current.marks||[]).map(m=>`<div class="bookmarkitem"><button data-goto="${m.pos}">♧ ${esc(m.label)}</button><button data-rm="${m.id}" aria-label="책갈피 삭제">×</button></div>`).join(''):'<p class="hint">아직 저장한 책갈피가 없습니다. 읽다가 ♧ 아이콘을 눌러 저장하세요.</p>'}</div>`);$$('[data-goto]').forEach(b=>b.onclick=()=>{let pos=+b.dataset.goto;closeModal();$('#reader').scrollTo({top:pos/Math.max(1,current.text.length)*($('#reader').scrollHeight-$('#reader').clientHeight),behavior:'smooth'})});$$('[data-rm]').forEach(b=>b.onclick=()=>{current.marks=current.marks.filter(m=>String(m.id)!==b.dataset.rm);persist();showBookmarks()})}
function stopTts(){if('speechSynthesis'in window)speechSynthesis.cancel();tts=null;$('#ttsBtn').textContent='▷'}
function speak(){if(!('speechSynthesis'in window)){toast('이 브라우저는 시스템 음성 읽기를 지원하지 않습니다.');return}if(speechSynthesis.speaking){stopTts();return}let text=$('#article').innerText;let pos=window.scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);let start=Math.floor(text.length*pos);text=text.slice(start);let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1;u.onend=()=>{$('#ttsBtn').textContent='▷'};u.onerror=()=>{$('#ttsBtn').textContent='▷'};speechSynthesis.cancel();speechSynthesis.speak(u);$('#ttsBtn').textContent='Ⅱ';toast('시스템 음성으로 읽습니다. 다시 누르면 멈춥니다.')}
$('#ttsBtn').onclick=speak;
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open')}$('#modalClose').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()}
function openPaste(){openModal('텍스트 붙여넣기',`<div class="field"><label>책 제목</label><input id="pasteTitle" placeholder="예: 붉은 흙길 끝에서"></div><div class="field"><label>본문</label><textarea id="pasteText" placeholder="읽고 싶은 글을 여기에 붙여넣으세요."></textarea></div><p class="hint">붙여넣은 글은 이 기기의 서재에 저장됩니다.</p><div class="modalactions"><button class="btn" id="pasteCancel">취소</button><button class="btn primary" id="pasteSave">서재에 담기</button></div>`);$('#pasteCancel').onclick=closeModal;$('#pasteSave').onclick=()=>{let t=$('#pasteText').value.trim();if(!t){toast('본문을 입력해 주세요.');return}let title=$('#pasteTitle').value.trim()||titleFrom('',t);closeModal();makeBook(title,t,'txt')};setTimeout(()=>$('#pasteText').focus(),100)}
$('#pasteOpen').onclick=$('#pasteBtn').onclick=$('#landingPaste').onclick=openPaste;
$('#landingLibrary').onclick=()=>{ $('#landing').classList.add('hidden'); $('#home').classList.remove('hidden'); renderShelf(); };
$('#libraryBack').onclick=()=>{ $('#home').classList.add('hidden'); $('#landing').classList.remove('hidden'); };
$('#fileInput').addEventListener('cancel',()=>{});
function openSettings(){openModal('읽기 설정',`<div class="settingsgrid"><div class="settingcard"><label>글꼴</label><select id="prefFont"><option>Noto Serif KR</option><option>Batang</option><option>AppleMyungjo</option><option>serif</option><option>sans-serif</option><option>monospace</option></select></div><div class="settingcard"><label>글자 크기 · <span id="sizeLabel">${prefs.size}px</span></label><input id="prefSize" type="range" min="12" max="34" value="${prefs.size}"></div><div class="settingcard"><label>자간 · <span id="spaceLabel">${prefs.spacing}px</span></label><input id="prefSpace" type="range" min="-1" max="3" step=".25" value="${prefs.spacing}"></div><div class="settingcard"><label>화면 테마</label><select id="prefNight"><option value="false">밝은 종이</option><option value="true">나이트 모드</option></select></div></div><div class="modalactions"><button class="btn" id="settingsCancel">닫기</button><button class="btn primary" id="settingsApply">적용하기</button></div>`);$('#prefFont').value=prefs.font;$('#prefNight').value=String(prefs.night);$('#prefSize').oninput=e=>$('#sizeLabel').textContent=e.target.value+'px';$('#prefSpace').oninput=e=>$('#spaceLabel').textContent=e.target.value+'px';$('#settingsCancel').onclick=closeModal;$('#settingsApply').onclick=()=>{prefs.font=$('#prefFont').value;prefs.size=+$('#prefSize').value;prefs.spacing=+$('#prefSpace').value;prefs.night=$('#prefNight').value==='true';savePrefs();closeModal()}}
$('#settingsBtn').onclick=openSettings;
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadBooks();applyPrefs();
</script>
